<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dealer's Dock — Blox Fruits Trade Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0B0618;
    --bg-deep-2:#150B2A;
    --bg-surface:#1C1033;
    --bg-surface-2:#271745;
    --border:#3D2465;
    --border-soft:#2A1848;
    --text-primary:#F3EEFB;
    --text-secondary:#B29BD4;
    --text-faint:#6F5A93;
    --brass:#B06EF3;
    --brass-dim:#9457E0;
    --brass-glow:rgba(176,110,243,0.28);
    --danger:#F45B69;
    --common:#9CA3AF;
    --uncommon:#4ADE80;
    --rare:#38BDF8;
    --legendary:#FB923C;
    --mythical:#F43F5E;
    --radius:10px;
    --radius-lg:16px;
    --font-display:'Bebas Neue', sans-serif;
    --font-body:'Space Grotesk', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(176,110,243,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(139,92,246,0.08), transparent 55%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep-2) 100%);
    background-attachment:fixed;
    color:var(--text-primary);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px;}

  /* ---------- layout shell ---------- */
  #app{max-width:1180px;margin:0 auto;padding:0 20px 80px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:22px 0 18px;flex-wrap:wrap;
    border-bottom:1px solid var(--border-soft);margin-bottom:28px;
  }
  .brand{display:flex;align-items:baseline;gap:10px;cursor:pointer;}
  .brand-mark{
    font-family:var(--font-display);font-size:30px;letter-spacing:0.5px;
    color:var(--text-primary);line-height:1;
  }
  .brand-mark span{color:var(--brass);}
  .brand-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
    letter-spacing:1.5px;text-transform:uppercase;}
  .topbar-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .live-pill{
    display:flex;align-items:center;gap:8px;font-family:var(--font-mono);
    font-size:12px;color:var(--text-secondary);letter-spacing:0.3px;
  }
  .radar-dot{position:relative;width:8px;height:8px;border-radius:50%;background:#37E27A;flex:none;}
  .radar-dot::after{
    content:'';position:absolute;inset:-6px;border-radius:50%;
    border:1.5px solid #37E27A;opacity:0;animation:ping 2.2s ease-out infinite;
  }
  @keyframes ping{0%{opacity:0.65;transform:scale(0.4);}80%{opacity:0;transform:scale(2.2);}100%{opacity:0;}}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border-radius:8px;border:1px solid transparent;font-weight:600;font-size:14px;
    padding:11px 18px;transition:transform .14s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn-brass{background:var(--brass);color:#1C1204;}
  .btn-brass:hover{background:#C68CFF;transform:translateY(-2px);box-shadow:0 8px 22px -8px var(--brass-glow);}
  .btn-ghost{background:transparent;color:var(--text-primary);border-color:var(--border);}
  .btn-ghost:hover{border-color:var(--brass-dim);color:var(--brass);transform:translateY(-2px);box-shadow:0 6px 18px -10px var(--brass-glow);}
  .btn-danger{background:transparent;color:var(--danger);border-color:rgba(244,91,105,0.4);}
  .btn-danger:hover{background:rgba(244,91,105,0.1);transform:translateY(-2px);}
  .btn-sm{padding:8px 13px;font-size:12.5px;border-radius:7px;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;transform:none;box-shadow:none;}

  /* ---------- notifications ---------- */
  .notif-wrap{position:relative;}
  .notif-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:9px;
    font-family:var(--font-mono);font-weight:700;min-width:15px;height:15px;border-radius:8px;display:none;
    align-items:center;justify-content:center;padding:0 3px;}
  .notif-panel{display:none;position:absolute;top:calc(100% + 10px);right:0;width:310px;max-height:380px;
    overflow-y:auto;background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 20px 48px -16px rgba(0,0,0,0.65);z-index:60;padding:8px;}
  .notif-panel.open{display:block;}
  .notif-item{padding:11px 12px;border-radius:8px;cursor:pointer;transition:background .12s ease;margin-bottom:3px;}
  .notif-item:hover{background:var(--bg-surface-2);}
  .notif-item.unread{background:rgba(176,110,243,0.10);}
  .notif-msg{font-size:12.5px;color:var(--text-primary);line-height:1.45;}
  .notif-empty{padding:24px;text-align:center;color:var(--text-faint);font-size:12.5px;}

  .user-chip{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-secondary);}
  .user-chip-name{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- feed toolbar ---------- */
  .feed-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap;}
  .feed-title{font-family:var(--font-display);font-size:34px;letter-spacing:0.3px;line-height:1;}
  .feed-count{font-family:var(--font-mono);color:var(--text-faint);font-size:12.5px;margin-top:4px;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
  .chip{
    font-family:var(--font-mono);font-size:11.5px;letter-spacing:0.4px;text-transform:uppercase;
    padding:6px 12px;border-radius:999px;border:1px solid var(--border);color:var(--text-secondary);
    background:transparent;transition:all .14s ease;
  }
  .chip:hover{border-color:var(--brass-dim);color:var(--text-primary);transform:translateY(-1px);}
  .chip.active{background:var(--brass);color:#1C1204;border-color:var(--brass);}
  .search-input{
    flex:1;min-width:180px;background:var(--bg-surface);border:1px solid var(--border);
    color:var(--text-primary);padding:9px 13px;border-radius:8px;font-size:13.5px;
  }
  .search-input::placeholder{color:var(--text-faint);}

  /* ---------- trade card grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(300px,1fr));gap:16px;}
  .empty-state{
    text-align:center;padding:70px 20px;color:var(--text-faint);border:1px dashed var(--border);
    border-radius:var(--radius-lg);font-size:14px;
  }
  .empty-state strong{display:block;color:var(--text-secondary);font-family:var(--font-display);
    font-size:20px;letter-spacing:0.3px;margin-bottom:6px;font-weight:400;}

  .card{
    position:relative;background:var(--bg-surface);border:1px solid var(--border);
    border-radius:var(--radius-lg);padding:18px 18px 16px;cursor:pointer;
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    display:flex;flex-direction:column;gap:12px;overflow:hidden;
  }
  .card:hover{border-color:var(--brass-dim);transform:translateY(-4px);
    box-shadow:0 14px 32px -14px rgba(0,0,0,0.6), 0 0 26px var(--brass-glow);}
  .stamp{
    position:absolute;top:14px;right:-30px;transform:rotate(38deg);
    font-family:var(--font-mono);font-size:10px;letter-spacing:2px;font-weight:600;
    padding:3px 34px;border:1.5px solid;
  }
  .stamp.open{color:var(--uncommon);border-color:var(--uncommon);}
  .stamp.closed{color:var(--text-faint);border-color:var(--text-faint);}
  .card-row-label{font-family:var(--font-mono);font-size:10px;letter-spacing:1.6px;color:var(--text-faint);text-transform:uppercase;}
  .slots{display:flex;gap:7px;flex-wrap:wrap;}
  .slot{
    display:flex;align-items:center;gap:6px;background:var(--bg-surface-2);
    border:1px solid var(--border);border-radius:7px;padding:6px 9px;font-size:12.5px;font-weight:600;
  }
  .slot-dot{width:7px;height:7px;border-radius:2px;flex:none;}
  .slot-empty{color:var(--text-faint);font-size:12px;font-style:italic;font-weight:400;}
  .swap-divider{display:flex;align-items:center;gap:10px;color:var(--text-faint);font-family:var(--font-mono);font-size:11px;}
  .swap-divider::before,.swap-divider::after{content:'';flex:1;height:1px;background:var(--border-soft);}
  .card-note{font-size:12.5px;color:var(--text-secondary);font-style:italic;}
  .card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px;padding-top:12px;border-top:1px solid var(--border-soft);}
  .poster{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}
  .avatar{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--brass),var(--mythical));flex:none;
    display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;color:#1C1204;font-weight:700;}
  .timeago{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}

  /* ---------- forms / pages ---------- */
  .page{max-width:720px;margin:0 auto;}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:13px;
    font-family:var(--font-mono);margin-bottom:20px;background:none;border:none;padding:0;}
  .back-link:hover{color:var(--brass);}
  .panel{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px;}
  .page-title{font-family:var(--font-display);font-size:32px;margin:0 0 4px;letter-spacing:0.3px;}
  .page-sub{color:var(--text-faint);font-size:13.5px;margin:0 0 26px;}
  .field{margin-bottom:22px;}
  .field-label{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--text-secondary);margin-bottom:9px;}
  .field-hint{font-size:12px;color:var(--text-faint);margin-top:7px;line-height:1.6;}
  .text-input{
    width:100%;background:var(--bg-deep);border:1px solid var(--border);color:var(--text-primary);
    padding:11px 13px;border-radius:8px;font-size:14px;transition:border-color .15s ease;
  }
  .text-input:focus{border-color:var(--brass-dim);}
  textarea.text-input{resize:vertical;min-height:64px;}

  .picker{border:1px solid var(--border);border-radius:10px;background:var(--bg-deep);padding:12px;}
  .picker-top{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .picker-rarity-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;max-height:200px;overflow-y:auto;padding-right:2px;}
  .fruit-tile{
    display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:7px;
    border:1px solid var(--border);background:var(--bg-surface);font-size:12.5px;font-weight:600;
    color:var(--text-secondary);text-align:left;transition:all .12s ease;
  }
  .fruit-tile:hover{border-color:var(--brass-dim);color:var(--text-primary);transform:translateY(-1px);box-shadow:0 0 0 1px var(--brass-glow);}
  .fruit-tile.selected{border-color:var(--brass);background:var(--brass-glow);color:var(--text-primary);}
  .fruit-tile.disabled{opacity:0.3;pointer-events:none;}
  .fruit-dot{width:7px;height:7px;border-radius:2px;flex:none;}
  .picker-selected{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;min-height:34px;}
  .selected-chip{
    display:flex;align-items:center;gap:7px;background:var(--bg-surface-2);border:1px solid var(--brass-dim);
    border-radius:7px;padding:6px 6px 6px 10px;font-size:12.5px;font-weight:600;
  }
  .chip-remove{background:none;border:none;color:var(--text-faint);font-size:14px;line-height:1;padding:2px 4px;}
  .chip-remove:hover{color:var(--danger);}
  .picker-count{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}

  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;}
  .error-msg{color:var(--danger);font-size:13px;margin-top:10px;}

  /* ---------- trade detail ---------- */
  .detail-hero{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px;position:relative;overflow:hidden;margin-bottom:26px;}
  .detail-poster{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .detail-poster-name{font-family:var(--font-display);font-size:22px;letter-spacing:0.3px;}
  .detail-slots-block{margin-bottom:16px;}
  .detail-slots{display:flex;gap:10px;flex-wrap:wrap;}
  .big-slot{
    display:flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);
    border-radius:9px;padding:10px 14px;font-size:14px;font-weight:600;
  }
  .big-slot .fruit-dot{width:9px;height:9px;}
  .rarity-tag{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;}

  .thread{margin-top:6px;}
  .thread-title{font-family:var(--font-display);font-size:22px;margin:0 0 14px;letter-spacing:0.3px;}
  .offer-item{background:var(--bg-surface);border:1px solid var(--border-soft);border-radius:12px;padding:16px 18px;margin-bottom:12px;transition:opacity .15s ease;}
  .offer-item.accepted{border-color:var(--uncommon);}
  .offer-item.declined{opacity:0.55;}
  .offer-item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
  .offer-item-name{font-weight:700;font-size:13.5px;}
  .offer-badge{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:5px;}
  .offer-badge.accept{background:rgba(74,222,128,0.12);color:var(--uncommon);}
  .offer-badge.counter{background:rgba(176,110,243,0.14);color:var(--brass);}
  .offer-badge.declined{background:rgba(244,91,105,0.12);color:var(--danger);}
  .offer-note{font-size:12.5px;color:var(--text-secondary);font-style:italic;margin-top:8px;}
  .offer-actions{margin-top:10px;display:flex;gap:8px;}

  .make-offer-box{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-top:24px;}
  .mo-choice{display:flex;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  .mo-choice .btn{flex:1;}
  .closed-banner{
    display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.03);border:1px solid var(--border);
    border-radius:10px;padding:14px 16px;color:var(--text-secondary);font-size:13px;margin-top:24px;
  }

  /* ---------- chat ---------- */
  .chat-box{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-top:26px;}
  .chat-box-head{font-family:var(--font-mono);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--brass);margin-bottom:14px;}
  .chat-msgs{display:flex;flex-direction:column;gap:9px;max-height:300px;overflow-y:auto;margin-bottom:14px;padding-right:4px;}
  .chat-msg{max-width:80%;display:flex;flex-direction:column;gap:3px;}
  .chat-msg.me{align-self:flex-end;align-items:flex-end;}
  .chat-msg.them{align-self:flex-start;align-items:flex-start;}
  .chat-msg-who{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);}
  .chat-msg-txt{padding:8px 13px;border-radius:11px;font-size:13px;line-height:1.45;background:var(--bg-surface-2);border:1px solid var(--border-soft);}
  .chat-msg.me .chat-msg-txt{background:var(--brass);color:#1C1204;border-color:var(--brass);}
  .chat-input-row{display:flex;gap:8px;}
  .chat-input-row .text-input{flex:1;}

  .setup-note{
    max-width:720px;margin:60px auto;background:var(--bg-surface);border:1px solid var(--legendary);
    border-radius:var(--radius-lg);padding:24px 26px;font-size:14px;line-height:1.6;color:var(--text-secondary);
  }
  .setup-note h2{font-family:var(--font-display);color:var(--legendary);font-size:24px;margin-top:0;letter-spacing:0.3px;}
  .setup-note code{background:var(--bg-deep);padding:2px 6px;border-radius:4px;font-family:var(--font-mono);font-size:12.5px;color:var(--brass);}

  footer.site-foot{text-align:center;color:var(--text-faint);font-family:var(--font-mono);font-size:11px;margin-top:60px;letter-spacing:0.3px;}

  @media (max-width:640px){
    .feed-title{font-size:27px;}
    .brand-mark{font-size:24px;}
    .panel,.detail-hero{padding:18px;}
    .notif-panel{width:260px;right:-40px;}
  }
  @media (prefers-reduced-motion: reduce){
    .radar-dot::after{animation:none;}
    .card, .btn, .chip, .fruit-tile{transition:none;}
  }
</style>
</head>

const RARITIES = ['Common','Uncommon','Rare','Legendary','Mythical'];
const FRUITS = [

/* ============================================================
   AUTH BOOTSTRAP
   ============================================================ */
function bootFirebase(){
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  auth = getAuth(app);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      uid = user.uid;
      try { await loadOrCreateUserProfile(user); }
      catch(e){ myUsername = user.displayName || 'Trader'; }
      renderTopbarRight();
      listenNotifications();
      router();
    } else {
      uid = null; myUsername = '';
      cleanupAll();
      renderTopbarRight();
      renderLogin();
    }
  });
}

async function loadOrCreateUserProfile(user){
  const uRef = doc(db,'users',user.uid);
  const snap = await getDoc(uRef);
  if (snap.exists()) {
    myUsername = snap.data().username || user.displayName || 'Trader';
  } else {
    myUsername = user.displayName || ('Trader' + user.uid.slice(0,4));
    await setDoc(uRef, {
      username: myUsername,
      provider: user.providerData?.[0]?.providerId === 'google.com' ? 'google' : 'guest',
      createdAt: serverTimestamp()
    });
  }
}

function usernameToEmail(u){
  return u.trim().toLowerCase().replace(/[^a-z0-9_]/g,'') + '@guest.dealersdock.local';
}
function friendlyAuthError(err){
  if (err.code === 'auth/weak-password') return 'Password must be at least 6 characters.';
  if (err.code === 'auth/invalid-email') return 'Usernames can only contain letters, numbers and underscores.';
  return err.message || 'Something went wrong — try again.';
}
async function guestContinue(username, password){
  const email = usernameToEmail(username);
  try {
    await signInWithEmailAndPassword(auth, email, password);
    return;
  } catch(err){
    if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: username });
        await setDoc(doc(db,'users',cred.user.uid), { username, provider:'guest', createdAt: serverTimestamp() });
        return;
      } catch(createErr){
        if (createErr.code === 'auth/email-already-in-use') {
          throw new Error('That username is taken. Double-check your password, or pick a different username.');
        }
        throw new Error(friendlyAuthError(createErr));
      }
    }
    if (err.code === 'auth/wrong-password') {
      throw new Error('Wrong password for that username. Try again, or pick a different username to create a new account.');
    }
    throw new Error(friendlyAuthError(err));
  }
}
async function googleSignIn(){
  const provider = new GoogleAuthProvider();
  await signInWithPopup(auth, provider);
}

/* ============================================================
   HELPERS
   ============================================================ */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeAgo(ts){
  if (!ts) return 'just now';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const secs = Math.floor((Date.now() - d.getTime())/1000);
  if (secs < 60) return 'just now';
  if (secs < 3600) return Math.floor(secs/60)+'m ago';
  if (secs < 86400) return Math.floor(secs/3600)+'h ago';
  return Math.floor(secs/86400)+'d ago';
}
function tsMillis(ts){
  if (!ts) return Date.now();
  return ts.toMillis ? ts.toMillis() : new Date(ts).getTime();
}
function initials(name){
  return (name || '?').trim().slice(0,2).toUpperCase();
}
function slotHtml(fruit, big){
  const cls = big ? 'big-slot' : 'slot';
  return `<span class="${cls}"><span class="fruit-dot" style="background:${RARITY_COLOR[fruit.rarity]}"></span>${esc(fruit.name)}${big?`<span class="rarity-tag">${fruit.rarity}</span>`:''}</span>`;
}
function setLiveCount(text){
  const el = document.getElementById('live-count');
  if (el) el.textContent = text;
}
function cleanupListeners(){
  if (unsubDetail) { unsubDetail(); unsubDetail = null; }
  if (unsubOffers) { unsubOffers(); unsubOffers = null; }
  if (unsubChat) { unsubChat(); unsubChat = null; currentChatId = null; }
}
function cleanupAll(){
  cleanupListeners();
  if (unsubFeed) { unsubFeed(); unsubFeed = null; }
  if (unsubNotif) { unsubNotif(); unsubNotif = null; }
  latestTrades = []; myNotifications = []; currentOffers = [];

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
function listenNotifications(){
  if (unsubNotif) unsubNotif();
  // Single equality filter only — avoids needing a composite index.
  const q = query(collection(db,'notifications'), where('toUid','==',uid));
  unsubNotif = onSnapshot(q, (snap) => {
    myNotifications = snap.docs.map(d => ({id:d.id, ...d.data()}))
      .sort((a,b) => tsMillis(b.createdAt) - tsMillis(a.createdAt));
    updateNotifBadge();
    paintNotifPanel();
  });
}
function updateNotifBadge(){
  const badge = document.getElementById('notif-badge');
  if (!badge) return;
  const unread = myNotifications.filter(n => !n.read).length;
  if (unread > 0) { badge.style.display = 'flex'; badge.textContent = unread > 9 ? '9+' : unread; }
  else { badge.style.display = 'none'; }
}
function toggleNotifPanel(){
  const panel = document.getElementById('notif-panel');
  if (!panel) return;
  const opening = !panel.classList.contains('open');
  panel.classList.toggle('open');
  if (opening) { paintNotifPanel(); markAllNotifsRead(); }
}
function paintNotifPanel(){
  const panel = document.getElementById('notif-panel');
  if (!panel) return;
  if (!myNotifications.length) { panel.innerHTML = '<div class="notif-empty">No notifications yet.</div>'; return; }
  panel.innerHTML = myNotifications.map(n => `
    <div class="notif-item ${n.read?'':'unread'}" data-trade="${n.tradeId||''}">
      <div class="notif-msg">${esc(n.message)}</div>
      <div class="timeago" style="margin-top:6px">${timeAgo(n.createdAt)}</div>
    </div>`).join('');
  panel.querySelectorAll('[data-trade]').forEach(el => {
    el.addEventListener('click', () => {
      const tid = el.dataset.trade;
      panel.classList.remove('open');
      if (tid) location.hash = '#/trade/' + tid;
    });
  });
}
async function markAllNotifsRead(){
  const unread = myNotifications.filter(n => !n.read);
  for (const n of unread) {
    try { await updateDoc(doc(db,'notifications',n.id), { read:true }); } catch(e){}
  }
}

function renderHome(){

    const q = query(collection(db,'trades'), where('status','==','open'), orderBy('createdAt','desc'));
    unsubFeed = onSnapshot(q, (snap) => {
      latestTrades = snap.docs.map(d => ({id:d.id, ...d.data()}));

      if (!location.hash || location.hash === '#/') paintFeed();

      viewRoot.innerHTML = `<div class="setup-note"><h2>⚠ Database error</h2><p>${esc(err.message)}</p>

function paintFeed(){
  const rows = latestTrades.filter(t => {
    if (feedRarityFilter !== 'All') {
      const has = (t.offering||[]).some(f=>f.rarity===feedRarityFilter) || (t.wanting?.fruits||[]).some(f=>f.rarity===feedRarityFilter);
      if (!has) return false;
    }
    if (feedSearch) {
      const s = feedSearch.toLowerCase();
      const hay = [t.username, ...(t.offering||[]).map(f=>f.name), ...((t.wanting?.fruits)||[]).map(f=>f.name), t.wanting?.note]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(s)) return false;
    }
    return true;
  });

  viewRoot.innerHTML = `
    <div class="feed-head">
      <div>
        <div class="feed-title">Live Trade Board</div>
        <div class="feed-count">${rows.length} open ${rows.length===1?'post':'posts'} · updates in real time</div>
      </div>
    </div>

      <input class="search-input" id="feed-search" placeholder="Search a fruit or a username…" value="${esc(feedSearch)}">
      <button class="chip ${feedRarityFilter==='All'?'active':''}" data-r="All">All</button>
      ${RARITIES.map(r=>`<button class="chip ${feedRarityFilter===r?'active':''}" data-r="${r}">${r}</button>`).join('')}
    </div>
    <div class="grid" id="feed-grid">
      ${rows.length ? rows.map(cardHtml).join('') : `<div class="empty-state" style="grid-column:1/-1">
        <strong>No trades match yet</strong>No one's posted this combo right now — be the first.
      </div>`}
    </div>
  `;

  document.getElementById('feed-search').addEventListener('input', (e)=>{
    feedSearch = e.target.value; paintFeed();
    const inp = document.getElementById('feed-search');
    inp.focus(); inp.selectionStart = inp.value.length;
  });
  document.querySelectorAll('.chip[data-r]').forEach(el=>{
    el.addEventListener('click', ()=>{ feedRarityFilter = el.dataset.r; paintFeed(); });
  });
  document.querySelectorAll('.card[data-id]').forEach(el=>{
    el.addEventListener('click', ()=> location.hash = '#/trade/'+el.dataset.id);
  });
}

function cardHtml(t){

/* ============================================================
   FRUIT PICKER COMPONENT
   ============================================================ */
function createFruitPicker(maxCount, initial){
  let selected = [...(initial||[])];
  let rarity = 'All';
  let search = '';

  const wrap = document.createElement('div');
  wrap.className = 'picker';

  const rarityRow = document.createElement('div');
  rarityRow.className = 'picker-rarity-row';
  const top = document.createElement('div');
  top.className = 'picker-top';
  const searchInput = document.createElement('input');
  searchInput.className = 'text-input';
  searchInput.placeholder = 'Search fruits…';
  top.appendChild(searchInput);

  const grid = document.createElement('div');
  grid.className = 'picker-grid';

  const selectedRow = document.createElement('div');
  selectedRow.className = 'picker-selected';

  const countEl = document.createElement('div');
  countEl.className = 'picker-count';

  wrap.append(top, rarityRow, grid, selectedRow, countEl);

  function isSelected(f){ return selected.some(s=>s.name===f.name); }
  function toggle(f){
    if (isSelected(f)) selected = selected.filter(s=>s.name!==f.name);
    else if (selected.length < maxCount) selected = [...selected, f];
    paint();
  }

  function paint(){
    countEl.textContent = `${selected.length} / ${maxCount} selected`;

    rarityRow.innerHTML = '';
    ['All', ...RARITIES].forEach(r=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (rarity===r?' active':'');
      b.textContent = r;
      b.addEventListener('click', ()=>{ rarity = r; paint(); });
      rarityRow.appendChild(b);
    });

    grid.innerHTML = '';
    FRUITS.filter(f => (rarity==='All'||f.rarity===rarity) && f.name.toLowerCase().includes(search.toLowerCase()))
      .forEach(f=>{
        const btn = document.createElement('button');
        btn.type = 'button';
        const full = !isSelected(f) && selected.length >= maxCount;
        btn.className = 'fruit-tile' + (isSelected(f)?' selected':'') + (full?' disabled':'');
        btn.innerHTML = `<span class="fruit-dot" style="background:${RARITY_COLOR[f.rarity]}"></span>${esc(f.name)}`;
        btn.addEventListener('click', ()=> toggle(f));
        grid.appendChild(btn);
      });

    selectedRow.innerHTML = '';
    selected.forEach(f=>{
      const chip = document.createElement('div');
      chip.className = 'selected-chip';
      chip.innerHTML = `<span class="fruit-dot" style="background:${RARITY_COLOR[f.rarity]}"></span>${esc(f.name)}`;
      const rm = document.createElement('button');
      rm.className = 'chip-remove'; rm.type='button'; rm.textContent = '×';
      rm.addEventListener('click', ()=> toggle(f));
      chip.appendChild(rm);
      selectedRow.appendChild(chip);
    });
  }

  searchInput.addEventListener('input', (e)=>{ search = e.target.value; paint(); });
  paint();

  return { el: wrap, getSelected: () => selected };
}

          <div class="detail-slots" style="margin-top:8px">${wantFruits.map(f=>slotHtml(f,true)).join('')}</div>
          ${wantNote ? `<div class="card-note" style="margin-top:8px">"${esc(wantNote)}"</div>` : ''}
          ${(!wantFruits.length && !wantNote) ? '<div class="slot-empty">open to any offer</div>' : ''}
        </div>
        ${isOwner ? `<div class="form-actions" style="margin-top:6px">
            ${isOpen ? `<button class="btn btn-danger btn-sm" id="cancel-trade">Cancel this post</button>` : ''}
          </div>` : ''}
      </div>

      <div class="thread">
        <div class="thread-title">Counter Offers</div>
        <div id="offers-list"></div>
      </div>

      ${isOpen && !isOwner ? `
      <div class="make-offer-box" id="make-offer-box">
        <div class="card-row-label" style="margin-bottom:12px">Make an Offer</div>
        <div class="mo-choice">
          <button class="btn btn-brass" id="mo-accept">Send exactly what they want</button>
          <button class="btn btn-ghost" id="mo-counter">Propose a different offer</button>
        </div>
        <div id="mo-form"></div>
      </div>` : (!isOpen ? `<div class="closed-banner">This trade is closed and no longer accepting offers.</div>` : '')}

      <div id="chat-slot"></div>
    </div>
  `;

  document.getElementById('back').addEventListener('click', ()=> location.hash = '#/');
  if (isOwner && isOpen) {
    document.getElementById('cancel-trade').addEventListener('click', async ()=>{
      if (!confirm('Cancel this trade post? This cannot be undone.')) return;
      await updateDoc(doc(db,'trades',tradeId), { status:'closed', closedWith:null });
    });
  }

  if (isOpen && !isOwner) {
    document.getElementById('mo-accept').addEventListener('click', ()=> submitOffer(tradeId, t, 'accept', wantFruits, ''));
    document.getElementById('mo-counter').addEventListener('click', ()=> showCounterForm(tradeId, t));
  }

  if (unsubOffers) unsubOffers();
  const q = query(collection(db,'offers'), where('tradeId','==',tradeId), orderBy('createdAt','asc'));
  unsubOffers = onSnapshot(q, (snap)=>{
    currentOffers = snap.docs.map(d=>({id:d.id, ...d.data()}));
    paintOffers(tradeId, t, isOwner, isOpen);
  });
}

function paintOffers(tradeId, t, isOwner, isOpen){
  const listEl = document.getElementById('offers-list');
  if (!listEl) return;

  if (!currentOffers.length) {
    listEl.innerHTML = `<div class="empty-state">No offers yet — be the first to counter.</div>`;
  } else {
    listEl.innerHTML = currentOffers.map(o=>{
      const status = o.status || 'pending';
      const badgeClass = status==='declined' ? 'declined' : (o.type==='accept' ? 'accept' : 'counter');
      const badgeText = status==='accepted' ? 'Accepted'
        : status==='declined' ? 'Declined'
        : (o.type==='accept' ? 'Sent what you asked' : 'Counter offer');
      const canAct = isOwner && isOpen && status==='pending';
      return `
      <div class="offer-item ${status}">
        <div class="offer-item-head">
          <span class="offer-item-name">${esc(o.username)}</span>
          <span class="offer-badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="slots">${(o.offering||[]).map(f=>slotHtml(f,false)).join('') || '<span class="slot-empty">no fruits listed</span>'}</div>
        ${o.note ? `<div class="offer-note">"${esc(o.note)}"</div>` : ''}
        <div class="timeago" style="margin-top:8px">${timeAgo(o.createdAt)}</div>
        ${canAct ? `<div class="offer-actions">
          <button class="btn btn-brass btn-sm" data-accept="${o.id}">Accept this offer</button>
          <button class="btn btn-danger btn-sm" data-decline="${o.id}">Decline</button>
        </div>` : ''}
      </div>`;
    }).join('');
  }

  listEl.querySelectorAll('[data-accept]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const offer = currentOffers.find(o=>o.id===btn.dataset.accept);
      if (!offer) return;
      btn.disabled = true; btn.textContent = 'Accepting…';
      await acceptOfferFn(tradeId, t, offer);
    });
  });
  listEl.querySelectorAll('[data-decline]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const offer = currentOffers.find(o=>o.id===btn.dataset.decline);
      if (!offer) return;
      btn.disabled = true; btn.textContent = 'Declining…';
      await declineOfferFn(tradeId, t, offer);
    });
  });

  renderChatSection(tradeId, t);
}

async function acceptOfferFn(tradeId, t, offer){
  try {
    await updateDoc(doc(db,'trades',tradeId), { status:'closed', closedWith: offer.id });
    await updateDoc(doc(db,'offers',offer.id), { status:'accepted' });
    await setDoc(doc(db,'chats',offer.id), {
      tradeId, participants: [t.ownerId, offer.ownerId], createdAt: serverTimestamp()
    }, { merge:true });
    await addDoc(collection(db,'notifications'), {
      toUid: offer.ownerId, type:'accepted', tradeId, offerId: offer.id,
      message: `${myUsername} accepted your offer! Open the trade to chat and swap in-game names.`,
      createdAt: serverTimestamp(), read:false
    });
  } catch(err){
    alert('Could not accept offer: ' + err.message);
  }
}

async function declineOfferFn(tradeId, t, offer){
  const custom = prompt("Optional note to send with the decline (leave blank for the default message):", "");
  const message = (custom && custom.trim())
    ? custom.trim()
    : "Your trade was declined — try offering something a little better and send another counter!";
  try {
    await updateDoc(doc(db,'offers',offer.id), { status:'declined' });
    await addDoc(collection(db,'notifications'), {
      toUid: offer.ownerId, type:'declined', tradeId, offerId: offer.id,
      message, createdAt: serverTimestamp(), read:false
    });
  } catch(err){
    alert('Could not decline offer: ' + err.message);
  }
}

function showCounterForm(tradeId, t){
  const box = document.getElementById('mo-form');
  const picker = createFruitPicker(4, []);
  box.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'field-label';
  label.style.marginTop = '16px';
  label.textContent = "What you're offering instead";
  const noteWrap = document.createElement('textarea');
  noteWrap.className = 'text-input';
  noteWrap.placeholder = 'Optional note…';
  noteWrap.maxLength = 140;
  noteWrap.style.marginTop = '12px';
  const sendBtn = document.createElement('button');
  sendBtn.className = 'btn btn-brass';
  sendBtn.style.marginTop = '14px';
  sendBtn.textContent = 'Send Counter Offer';
  const err = document.createElement('div');
  err.className = 'error-msg';

  sendBtn.addEventListener('click', ()=>{
    const sel = picker.getSelected();
    const note = noteWrap.value.trim();
    if (!sel.length && !note) { err.textContent = 'Add at least one fruit or a note.'; return; }
    sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
    submitOffer(tradeId, t, 'counter', sel, note);
  });

  box.append(label, picker.el, noteWrap, err, sendBtn);
}

async function submitOffer(tradeId, t, type, offering, note){
  try {
    await addDoc(collection(db,'offers'), {
      ownerId: uid,
      tradeId,
      username: myUsername,
      type,
      status: 'pending',
      offering,
      note,
      createdAt: serverTimestamp()
    });
  } catch(err){
    alert('Could not send offer: ' + err.message);
  }
}

/* ---------- chat ---------- */
function renderChatSection(tradeId, t){
  const container = document.getElementById('chat-slot');
  if (!container) return;

  const acceptedOffer = currentOffers.find(o => o.status === 'accepted');
  const canChat = acceptedOffer && (uid === t.ownerId || uid === acceptedOffer.ownerId);

  if (!canChat) {
    container.innerHTML = '';
    if (unsubChat) { unsubChat(); unsubChat = null; currentChatId = null; }
    return;
  }

  const chatId = acceptedOffer.id;
  if (currentChatId === chatId) return; // already wired up

  currentChatId = chatId;
  if (unsubChat) unsubChat();

  container.innerHTML = `
    <div class="chat-box">
      <div class="chat-box-head">💬 Deal chat — swap your in-game names here</div>
      <div class="chat-msgs" id="chat-msgs"></div>
      <div class="chat-input-row">
        <input class="text-input" id="chat-input" placeholder="Type a message…" maxlength="300">
        <button class="btn btn-brass btn-sm" id="chat-send">Send</button>
      </div>
    </div>`;

  // No orderBy here on purpose: a message you just sent shows createdAt:null
  // locally until the server acknowledges the serverTimestamp(), and an
  // orderBy query silently excludes docs with an unresolved sort field from
  // your own snapshot until that ack arrives. Sorting client-side (with a
  // clientTs fallback) means your own message renders immediately instead
  // of only appearing once it round-trips the server.
  const msgsQ = collection(db,'chats',chatId,'messages');
  unsubChat = onSnapshot(msgsQ, (snap)=>{
    const msgs = snap.docs.map(d=>({id:d.id, ...d.data()}))
      .sort((a,b)=> msgSortKey(a) - msgSortKey(b));
    paintChatMsgs(msgs);
  });

  document.getElementById('chat-send').addEventListener('click', ()=> sendChatMsg(chatId));
  document.getElementById('chat-input').addEventListener('keypress', (e)=>{ if (e.key==='Enter') sendChatMsg(chatId); });
}

function msgSortKey(m){
  // Prefer the server-confirmed timestamp once it exists; fall back to the
  // client-side timestamp we stamped at send time so an unacknowledged
  // message still sorts into (roughly) the right place immediately.
  if (m.createdAt && m.createdAt.toMillis) return m.createdAt.toMillis();
  return m.clientTs || 0;
}
function paintChatMsgs(msgs){
  const el = document.getElementById('chat-msgs');
  if (!el) return;
  if (!msgs.length) {
    el.innerHTML = '<div class="slot-empty" style="padding:16px 0">Say hi and trade your usernames!</div>';
    return;
  }
  el.innerHTML = msgs.map(m => `
    <div class="chat-msg ${m.senderId===uid?'me':'them'}">
      <div class="chat-msg-who">${esc(m.senderName)}</div>
      <div class="chat-msg-txt">${esc(m.text)}</div>
    </div>`).join('');
  el.scrollTop = el.scrollHeight;
}

async function sendChatMsg(chatId){
  const inp = document.getElementById('chat-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  try {
    await addDoc(collection(db,'chats',chatId,'messages'), {
      senderId: uid, senderName: myUsername, text, createdAt: serverTimestamp(), clientTs: Date.now()
    });
  } catch(err){
    alert('Could not send message: ' + err.message);
  }
}
</script>
